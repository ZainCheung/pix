[workspace]
members = [
    "crates/pix-cli",
    "crates/pix-core",
    "crates/pix-wire",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/ZainCheung/pix"
homepage = "https://github.com/ZainCheung/pix"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
blake2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
fs2 = "0.4"
getrandom = "0.3"
hostname = "0.4"
libc = "0.2"
mdns-sd = "0.20.3"
snow = "0.10"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
uuid = { version = "1.17", features = ["serde", "v4"] }
uniffi = "0.32.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
