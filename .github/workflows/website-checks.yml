name: Website checks

on:
  push:
    branches:
      - main
    paths:
      - website/**
      - docs/**
      - .github/workflows/website-checks.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - .github/workflows/website-checks.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  check:
    name: Website typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Generate route tree
        run: npm run generate-routes
      - run: npm run typecheck
      - run: npm run build
      # TanStack Start restores its generated type footer during the Vite build.
      - name: Verify generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Smoke test generated endpoints
        run: |
          set -eu
          log_file="$RUNNER_TEMP/pix-website.log"
          llms_file="$RUNNER_TEMP/pix-llms.txt"
          sitemap_file="$RUNNER_TEMP/pix-sitemap.xml"
          robots_file="$RUNNER_TEMP/pix-robots.txt"

          npm run dev -- --host 127.0.0.1 > "$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/llms.txt > "$llms_file"; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$log_file"
            exit 1
          fi

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/sitemap.xml > "$sitemap_file"
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/robots.txt > "$robots_file"

          grep -Fq '# Pix' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/docs/installation' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/use-cases/pi-from-iphone' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/docs/installation' "$sitemap_file"
          grep -Fq 'Sitemap: https://pix.deepoke.com/sitemap.xml' "$robots_file"
