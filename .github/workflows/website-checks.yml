name: Website checks

on:
  push:
    branches:
      - main
    paths:
      - website/**
      - docs/**
      - .github/workflows/website-checks.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - .github/workflows/website-checks.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  check:
    name: Website typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check-doc-links
      - name: Generate route tree
        run: npm run generate-routes
      - run: npm run typecheck
      - run: npm run build
      # TanStack Start restores its generated type footer during the Vite build.
      - name: Verify generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Smoke test generated endpoints
        run: |
          set -eu
          log_file="$RUNNER_TEMP/pix-website.log"
          llms_file="$RUNNER_TEMP/pix-llms.txt"
          sitemap_file="$RUNNER_TEMP/pix-sitemap.xml"
          robots_file="$RUNNER_TEMP/pix-robots.txt"
          home_file="$RUNNER_TEMP/pix-home.html"
          installation_file="$RUNNER_TEMP/pix-installation.html"

          npm run dev -- --host 127.0.0.1 > "$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/llms.txt > "$llms_file"; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$log_file"
            exit 1
          fi

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/sitemap.xml > "$sitemap_file"
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/robots.txt > "$robots_file"
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/ > "$home_file"
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/docs/installation > "$installation_file"
          for docs_path in \
            quickstart platform-support configuration services \
            diagnostics headless-host cli self-host-relay architecture; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:3000/docs/$docs_path" > /dev/null
          done

          grep -Fq '# Pix' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/docs/installation' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/docs/platform-support' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/docs/services' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/docs/diagnostics' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/use-cases/pi-from-iphone' "$llms_file"
          grep -Fq 'https://pix.deepoke.com/docs/installation' "$sitemap_file"
          grep -Fq 'https://pix.deepoke.com/docs/platform-support' "$sitemap_file"
          grep -Fq 'https://pix.deepoke.com/docs/services' "$sitemap_file"
          grep -Fq 'https://pix.deepoke.com/docs/diagnostics' "$sitemap_file"
          grep -Eq '<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>' "$sitemap_file"
          grep -Fq 'Sitemap: https://pix.deepoke.com/sitemap.xml' "$robots_file"
          grep -Fq 'Pix connects your iPhone to the Pi coding agent' "$home_file"
          grep -Fq 'id="homebrew"' "$installation_file"
          if grep -Eq '/docs/[^[:space:]<"]*\((start|use-pix|understand-pix|advanced|reference|develop-pix)\)' \
            "$llms_file" "$sitemap_file"; then
            printf '%s\n' 'Generated docs URLs contain a Fumadocs route group.' >&2
            exit 1
          fi
          if grep -Fq 'Invalid hook call' "$log_file" ||
            grep -Fq 'Error in renderToReadableStream' "$log_file"; then
            cat "$log_file"
            exit 1
          fi
