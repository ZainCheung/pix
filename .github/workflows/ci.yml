name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1-5"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.classify.outputs.all }}
      rust: ${{ steps.classify.outputs.rust }}
      relay: ${{ steps.classify.outputs.relay }}
      apple: ${{ steps.classify.outputs.apple }}
      macos: ${{ steps.classify.outputs.macos }}
      linux: ${{ steps.classify.outputs.linux }}
      relay_deploy: ${{ steps.classify.outputs.relay_deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/detect-ci-changes.sh

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
        working-directory: relay
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  relay:
    name: Relay
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.relay == 'true'
    uses: ./.github/workflows/relay-checks.yml
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.relay_deploy == 'true' }}

  apple-wire:
    name: Apple pix-wire
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.apple == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - name: Install Apple Rust targets
        run: >-
          rustup target add
          aarch64-apple-ios
          aarch64-apple-ios-sim
          x86_64-apple-ios
          aarch64-apple-darwin
          x86_64-apple-darwin
      - name: Build XCFramework and typecheck Swift bindings
        run: packaging/apple/build-pix-wire-xcframework.sh "$RUNNER_TEMP/pix-wire-build"

  macos-app:
    name: macOS app
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test macOS menu-bar app
        working-directory: apps/macos
        run: >-
          xcodebuild test
          -project Pix.xcodeproj
          -scheme Pix
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

  linux-packaging:
    name: Linux packaging smoke test
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
      - run: rustup target add x86_64-unknown-linux-gnu
      - name: Build Linux archive
        env:
          SOURCE_DATE_EPOCH: "0"
          PIX_RELEASE_DIR: ${{ runner.temp }}/pix-release
        run: packaging/linux/build-release.sh x86_64-unknown-linux-gnu "$PIX_RELEASE_DIR"

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, rust, relay, apple-wire, macos-app, linux-packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RELAY_RESULT: ${{ needs.relay.result }}
          APPLE_RESULT: ${{ needs.apple-wire.result }}
          MACOS_RESULT: ${{ needs.macos-app.result }}
          LINUX_RESULT: ${{ needs.linux-packaging.result }}
        run: |
          set -eu
          for result in \
            "$CHANGES_RESULT" \
            "$RUST_RESULT" \
            "$RELAY_RESULT" \
            "$APPLE_RESULT" \
            "$MACOS_RESULT" \
            "$LINUX_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                printf '%s\n' "A required CI job ended with: $result" >&2
                exit 1
                ;;
            esac
          done
